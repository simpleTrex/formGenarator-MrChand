name: Deploy

on:
  push:
    branches: [deploy, docker-deploy]
  workflow_dispatch:

# Never run two deploys at once; a newer push replaces any queued one
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image prefix (ghcr requires lowercase)
        id: vars
        run: echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: Backend/api
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/formgen-backend:latest
            ${{ steps.vars.outputs.image_prefix }}/formgen-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/formgen-frontend:latest
            ${{ steps.vars.outputs.image_prefix }}/formgen-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload compose file (contains no secrets)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" 'mkdir -p ~/formgen && cat > ~/formgen/docker-compose.yml' < docker-compose.prod.yml

      - name: Deploy (secrets are piped over SSH stdin, never written to disk)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DOMAIN: ${{ secrets.DOMAIN }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf 'export DOMAIN=%q\n' "$DOMAIN"
            printf 'export MONGO_PASSWORD=%q\n' "$MONGO_PASSWORD"
            printf 'export JWT_SECRET=%q\n' "$JWT_SECRET"
            printf 'export IMAGE_PREFIX=%q\n' "$IMAGE_PREFIX"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'GHCR_USER=%q\n' "$GHCR_USER"
            printf 'GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            cat <<'REMOTE'
          set -e
          cd ~/formgen
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull </dev/null
          docker compose up -d --remove-orphans </dev/null
          docker logout ghcr.io
          docker image prune -af --filter "until=24h" </dev/null || true
          docker compose ps </dev/null
          free -h
          REMOTE
          } | ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" 'bash -s'

